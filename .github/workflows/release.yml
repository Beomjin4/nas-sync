name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  server-binaries:
    name: Server binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `cross` ships proper musl cross toolchains (the host's glibc-targeting
      # gcc can't link musl: undefined pwrite64/mmap64/lstat64 in sqlite3).
      - uses: taiki-e/install-action@cross
      - name: Build
        working-directory: server
        run: cross build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cp server/target/${{ matrix.target }}/release/obsidian-nas-server \
             nas-sync-server-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: nas-sync-server-linux-${{ matrix.arch }}

  docker-image:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  plugin:
    name: Plugin bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: plugin
        run: |
          npm ci
          npm run build
      - name: Package
        run: |
          mkdir -p out/nas-sync
          cp plugin/main.js plugin/manifest.json out/nas-sync/
          (cd out && zip -r nas-sync.zip nas-sync)
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            out/nas-sync.zip
            plugin/main.js
            plugin/manifest.json

  release:
    name: GitHub Release
    needs: [server-binaries, docker-image, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            nas-sync-server-linux-amd64
            nas-sync-server-linux-arm64
            nas-sync.zip
            main.js
            manifest.json
